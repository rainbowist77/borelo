# Uploaded images and other static files referenced from Markdown live under
# static/uploads/ as /static/uploads/<file>. Flask serves /static itself, but
# nginx can hand those files straight off disk. That avoids a Python hop for
# every image and lets long-cached assets be served with the right headers.
#
# The `alias` path is relative to the nginx container's own filesystem, so
# docker-compose mounts ./static read-only into /srv/static below.
upstream borelo_app {
    server host.docker.internal:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # Long-lived caching for uploaded media. Content-addressed names are not
    # guaranteed, so keep this short enough to survive a re-upload.
    location /static/uploads/ {
        alias /srv/static/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @app;
    }

    # CSS/JS change with the site version, so a modest TTL is enough.
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri @app;
    }

    location / {
        proxy_pass http://borelo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location @app {
        proxy_pass http://borelo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
