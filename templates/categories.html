{% extends 'base.html' %}
{% block title %}分类 · {{ site_name }}{% endblock %}
{% block content %}
<section class="section-head">
  <p class="eyebrow">Categories</p>
  <h1>分类</h1>
  <p class="section-lead">按主题浏览。</p>
</section>
{% if categories %}
<ul class="term-list">
  {% for name, count in categories.items() %}
  <li>
    <a href="{{ url_for('pages.category_detail', name=name) }}">{{ name }}</a>
    <span class="muted">{{ count }}</span>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="empty">暂无分类。</p>
{% endif %}
{% endblock %}
