<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B · Threshold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f0ebe3;
      --mute: #97a2a8;
      --display: "Noto Serif SC", serif;
      --latin: "Cormorant Garamond", serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); font-family: var(--display); background: #05080a; }
    .grain {
      position: fixed; inset: 0; pointer-events: none; opacity: 0.13; z-index: 8; mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/%3E%3C/svg%3E");
    }
    .hero {
      position: relative; min-height: 100vh; min-height: 100dvh;
      display: grid; grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }
    .scene {
      position: absolute; inset: 0; z-index: 0;
      background:
        linear-gradient(180deg, rgba(8,10,12,0.25) 0%, rgba(5,8,10,0.15) 40%, rgba(4,12,16,0.72) 72%, #040a0e 100%),
        radial-gradient(ellipse 90% 55% at 70% 18%, #6d726c 0%, #3d4240 42%, #171b1a 70%),
        linear-gradient(180deg, #2a2f2c 0%, #0b1c24 55%, #061018 100%);
    }
    .scene::before {
      content: ""; position: absolute; inset: 0 0 45% 0;
      background: radial-gradient(ellipse 40% 60% at 78% 70%, rgba(0,0,0,0.85), transparent 70%);
      filter: blur(1px);
    }
    .scene::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 48%;
      background:
        radial-gradient(ellipse 50% 30% at 30% 20%, rgba(150,190,200,0.12), transparent 70%),
        linear-gradient(180deg, transparent, rgba(10, 40, 50, 0.35));
      border-top: 1px solid rgba(236,230,220,0.08);
    }
    .top, .bottom, .stage { position: relative; z-index: 2; }
    .top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.4rem clamp(1.2rem, 4vw, 2.5rem);
    }
    .brand { font-family: var(--latin); letter-spacing: 0.3em; text-decoration: none; color: inherit; opacity: 0.9; }
    nav { display: flex; gap: 1.1rem; font-family: var(--latin); font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; }
    nav a { color: rgba(240,235,227,0.7); text-decoration: none; }
    .stage {
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 0 clamp(1.2rem, 5vw, 4rem) 3.5rem;
      max-width: 46rem;
    }
    .kicker { margin: 0 0 1rem; font-family: var(--latin); letter-spacing: 0.28em; text-transform: uppercase; font-size: 0.72rem; color: #a9b7bc; }
    h1 {
      margin: 0; font-size: clamp(3rem, 9vw, 5.6rem); font-weight: 700;
      letter-spacing: 0.14em; line-height: 1; text-shadow: 0 10px 40px rgba(0,0,0,0.45);
    }
    .lead {
      margin: 1.25rem 0 0; max-width: 16rem;
      font-family: var(--latin); font-style: italic; font-size: 1.35rem;
      color: rgba(240,235,227,0.88);
    }
    .meta-rail {
      position: absolute; left: clamp(1rem, 3vw, 2rem); top: 35%;
      writing-mode: vertical-rl; transform: rotate(180deg);
      font-size: 0.68rem; letter-spacing: 0.45em; color: rgba(240,235,227,0.45);
      z-index: 2;
    }
    .bottom {
      padding: 0 clamp(1.2rem, 4vw, 2.5rem) 1.5rem;
      display: flex; justify-content: space-between; gap: 1rem;
      font-family: var(--latin); font-size: 0.75rem; letter-spacing: 0.18em; color: rgba(240,235,227,0.55);
      border-top: 1px solid rgba(240,235,227,0.1);
      padding-top: 1rem; margin: 0 clamp(1.2rem, 4vw, 2.5rem) 1.25rem;
    }
    .below {
      background: #06090c; padding: 3rem clamp(1.2rem, 4vw, 2.5rem) 4rem;
      width: min(100%, 58rem); margin: 0 auto;
    }
    .below h2 { margin: 0 0 1.5rem; font-size: 0.75rem; letter-spacing: 0.28em; text-transform: uppercase; font-family: var(--latin); color: var(--mute); font-weight: 400; }
    .row { display: grid; grid-template-columns: 7rem 1fr; gap: 1rem; padding: 1.1rem 0; border-bottom: 1px solid rgba(240,235,227,0.1); }
    .row time { color: var(--mute); font-size: 0.9rem; }
    .row a { color: inherit; text-decoration: none; font-size: 1.2rem; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <div class="grain"></div>
  <section class="hero">
    <div class="scene" aria-hidden="true"></div>
    <div class="meta-rail">文学笔记 · 2026</div>
    <header class="top">
      <a class="brand" href="#">borelo</a>
      <nav>
        <a href="#">Archive</a>
        <a href="#">Categories</a>
        <a href="#">Tags</a>
      </nav>
    </header>
    <div class="stage">
      <p class="kicker">B · Threshold</p>
      <h1>borelo</h1>
      <p class="lead">文字与影子之间</p>
    </div>
    <div class="bottom">
      <span>2 articles</span>
      <span>last active 2026-11-08</span>
    </div>
  </section>
  <section class="below">
    <h2>Recent</h2>
    <div class="row"><time>2026-11-08</time><a href="#">夜路</a></div>
    <div class="row"><time>2026-11-01</time><a href="#">欢迎来到 borelo</a></div>
  </section>
</body>
</html>
